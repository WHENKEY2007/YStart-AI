services:
  - type: web
    name: ystart-ai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: SUPABASE_URL
        value: https://zbqvfubmlauotxcaemit.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
